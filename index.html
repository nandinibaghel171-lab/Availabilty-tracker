
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Availability Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>👥 Team Availability</h1>
            <p>Manage your team's availability in one place.</p>
        </header>

        <div class="dashboard">

            <div class="stat-card">
                <h3>Total Members</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="stat-card available-card">
                <h3>Available</h3>
                <h2 id="available">0</h2>
            </div>

            <div class="stat-card unavailable-card">
                <h3>Unavailable</h3>
                <h2 id="unavailable">0</h2>
            </div>

        </div>

        <div class="team-section">

            <h2>Team Members</h2>

            <div id="team-list"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
